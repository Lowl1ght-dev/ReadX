name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install dependencies & Build web app
      run: |
        cd pdf-reader
        npm install
        npm run build # Собирает веб-версию (папку dist/www) перед интеграцией в Capacitor

    - name: Install Capacitor CLI & Sync Android
      run: |
        cd pdf-reader
        npm install @capacitor/cli @capacitor/android
        npx cap add android
        npx cap sync android

    - name: Build Android App with Gradle
      run: |
        cd pdf-reader/android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: pdf-reader/android/app/build/outputs/apk/debug/app-debug.apk
